name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.10.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The §0 rule at its three boundaries: what a dependency is, what our code does, what we ship.
      - run: pnpm check:no-runtime-css
      # The source half. The `dist` half needs a build and runs in the release workflow.
      - run: pnpm check:attribution
      # Static wiring only — that the hydration fixtures are registered, served and really
      # hydrated. Whether every component server-renders is asserted by the suite in `test`.
      - run: pnpm check:ssr-coverage
      # The committed component→recipe manifest still describes the import graph. Stale, it drops
      # a recipe from the consumer's stylesheet and every test still passes.
      - run: pnpm check:component-recipes

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.10.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell
      # Three Vitest projects, split by which build of Solid each resolves — unit (client build,
      # no DOM), ssr (server builds of both `solid-js` and `@solidjs/web`), browser (real Chromium,
      # where every computed-style assertion lives). ~5s for all three.
      - run: pnpm test
      # The oracle is a real engine, so it needs the Chromium installed above. A style value can be
      # perfectly static — `mt="4x"` — and still emit CSS no browser parses.
      - run: pnpm check:declaration-support

  # The docs app is a standing consumer instance: it installs our packages by name, resolves them
  # through `exports` → `dist`, and runs its own Panda build. A red build here is a distribution
  # failure, not a documentation one.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.10.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:docs
