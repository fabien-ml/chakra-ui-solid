name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 11.10.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `--dist` is the half that matters and it needs the build above: rolldown strips every
      # unmarked block comment, so an `@license` header that lost its tag — or a `comments.legal`
      # someone unpinned — vanishes from `dist/` and the published package becomes an unattributed
      # derivative of the project we are porting, with a green build.
      - run: pnpm check:attribution --dist
      - run: pnpm check:no-runtime-css

      # A changeset written against a `0.0.0` package does not describe a release anybody can
      # install, and `changeset version` would turn it into a `0.0.1` publish of an unfinished
      # library. This step stops firing the day the first package takes a real version.
      - name: No changeset while a package is at 0.0.0
        run: |
          pending=$(find .changeset -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          zeroed=$(cat packages/*/package.json 2>/dev/null | grep -c '"version": "0.0.0"' || true)
          if [ "$pending" -gt 0 ] && [ "$zeroed" -gt 0 ]; then
            echo "::error::$pending pending changeset(s) while $zeroed package(s) are at 0.0.0."
            exit 1
          fi
          echo "$pending pending changeset(s), $zeroed package(s) at 0.0.0 — policy satisfied."

      - name: publish
        run: |
          echo "No package is publishable yet. This job gains 'changeset publish' when the first"
          echo "package takes a real version."
