packages:
  - "packages/*"
  - "apps/*"

# Panda loads `panda.config.ts` by bundling it, and esbuild's install script is what fetches the
# platform binary that does the bundling. Left unapproved it is a latent failure with a confusing
# message, on a package whose whole job is to run at build time.
allowBuilds:
  esbuild: true

catalog:
  # The solid trio moves in lockstep — a single Solid version across the repo. A version skew
  # breaks context and hydration *silently*, so the whole repo moves together.
  #
  # It is worth checking after every install that only one copy landed:
  #   ls node_modules/.pnpm | grep -E '^(solid-js|@solidjs\+(web|signals|vite-plugin))@'
  # Two lines there is the skew above, and nothing fails loudly when it happens.
  #
  # Run it after a **clean** install, though. Bumping these versions in place leaves the old
  # `.pnpm` directories orphaned — pnpm does not prune them — so the grep reports two lines for
  # every entry even when `pnpm-lock.yaml` mentions the old version zero times. That is a false
  # alarm, and `rm -rf node_modules && pnpm install` is what makes the check mean something.
  #
  # `@solidjs/signals` is not referenced by any package.json — it arrives transitively via
  # `solid-js`. The entry is here to document the lockstep, and costs nothing.
  solid-js: 2.0.0-rc.0
  "@solidjs/signals": 2.0.0-rc.0
  "@solidjs/web": 2.0.0-rc.0
  # The JSX compiler, pinned for the same reason the runtime is. Two pipelines compile this
  # repo's JSX today (the Vitest projects and Storybook; the docs app is the third) and they must
  # agree with each other AND with the runtime above — a mismatch surfaces deep inside
  # `@solidjs/web`, never as a config error. `solid-babel-options.ts` unifies the compiler's
  # *options*; these two entries unify its *version*.
  #
  # This was a live bug in hope-ui, not a hypothetical: the root pinned
  # `vite-plugin-solid@3.0.0-next.5` exactly while the docs app used `^3.0.0-next.11`, and
  # next.5 depends on `babel-preset-solid` by open range — so every test and story compiled
  # with `babel-preset-solid@2.0.0-beta.16` against a beta.19 runtime. `babel-preset-solid`
  # also needs the `overrides` entry below, because a catalog only binds specifiers that say
  # `catalog:` and the plugin asks for it by range.
  #
  # **The plugin was renamed.** `@solidjs/vite-plugin` is the package now; every config file in
  # this repo imports that name. `vite-plugin-solid@3.0.0-next.27` is its final release and is two
  # lines of `export * from "@solidjs/vite-plugin"` — it stays here for exactly one consumer:
  # `storybook-solidjs-vite`'s framework preset does a literal
  # `await import("vite-plugin-solid")` before `viteFinal` runs, so dropping it breaks
  # `pnpm storybook` at config time. It compiles nothing (`.storybook/main.ts` filters the
  # preset's plugin out and pushes ours), and the `overrides` entry below is what keeps its
  # `^3.0.0-next.27` range from resolving to a *second* copy of the compiler.
  "@solidjs/vite-plugin": 3.0.0-next.28
  vite-plugin-solid: 3.0.0-next.27
  babel-preset-solid: 2.0.0-rc.0

  # The three Zag packages `@chakra-ui-solid/core`'s `src/zag/` adapter binds to Solid. Pinned and moved
  # together: `@zag-js/core` owns `mergeProps` (which our own `mergeProps` delegates to for the
  # composing keys) and the `Bindable`/`Machine`/`Service` contracts the adapter implements, so a
  # skew between core and the machine packages is a behavior change with no type error to announce
  # it. The machine packages themselves (`@zag-js/dialog`, …) arrive at milestone 5 and join this
  # block at the same version.
  #
  # 1.43.0 is the fork's *target*; 1.42.0 is the baseline it was taken from and the number a
  # re-sync diffs against (`NOTICE.md`, `zag-solid-adapter.md` §1). The three deltas between them are
  # `zag-solid-adapter.md` §4.3.
  "@zag-js/core": 1.43.0
  "@zag-js/types": 1.43.0
  "@zag-js/utils": 1.43.0
  # Two more Zag utilities, on the same pin and for the same reason. `@chakra-ui-solid/core`'s
  # locale context takes `isRTL`/`createFilter` from `i18n-utils` and its environment context takes
  # `getDocument`/`getWindow` from `dom-query` — the same MIT packages Chakra reaches for through
  # Ark, rather than reimplementations (`plan.md` §7.2).
  "@zag-js/dom-query": 1.43.0
  "@zag-js/i18n-utils": 1.43.0
  # Storybook's warm-up imports this directly (`.storybook/preview.ts`), and every machine package
  # pulls it transitively. Two copies would mean two `setupGlobalFocusEvents` installations against
  # two module-level "already set up" flags, so the warm-up would run on one and the machines on the
  # other — and the warm-up exists precisely because the second installation throws.
  "@zag-js/focus-visible": 1.43.0

  # axe-core, in the catalog for a reason no other test dependency has: it is the one CJS module in
  # the `browser` project's graph, so it is the one that MUST be pre-bundled, and `vitest.config.ts`
  # names it in `optimizeDeps.include` (see the comment there). Vite matches an `include` entry to
  # an import by resolved file, so the root and `@chakra-ui-solid/internal-test-utils` resolving two
  # different copies would leave the import unbundled with the entry still pre-bundling something —
  # the mid-run re-optimization comes back and the `include` line still looks right.
  axe-core: 4.13.0

  # Storybook — the local playground (`testing.md` §7). Pinned exactly for the same reason the Solid
  # trio is, and the reason is Storybook-specific: 10.5's `enhanceContext` loader replaces
  # `HTMLElement.prototype.focus` with an accessor, `@zag-js/focus-visible` reads that property off
  # the prototype, and the getter throws `Illegal invocation` — which halts Solid's reactive system
  # and renders every story empty (`prior-art.md` §5.3, measured here at S3b). `.storybook/preview.ts`'s
  # warm-up is written against that exact mechanism, so a floating range could change the mechanism
  # under a workaround whose comment still describes the old one. **Nothing in CI opens a story**
  # (D-133), so a Storybook that a bump broke would be discovered by running it.
  #
  # `storybook-solidjs-vite` is the SolidJS 2.0 renderer (its `/next` entry) and is on its own
  # version line, one minor ahead of the core. The pairing is the one running in hope-ui today.
  storybook: 10.5.7
  storybook-solidjs-vite: 10.6.0

  # Panda, and the Chakra preset it reads. Pinned exactly and moved together for a reason the
  # other blocks do not have: `@pandacss/dev` is a **peerDependency** of three published packages
  # AND a devDependency here, and the two must name the same version — a consumer resolving a
  # different Panda than the one that generated `@chakra-ui-solid/styled-system` gets class names
  # our runtime computes and their stylesheet does not carry, with no error anywhere
  # (`plan.md` §3.4).
  #
  # `@pandacss/preset-base` is a direct dependency of `@chakra-ui-solid/panda-preset` rather than
  # something Panda supplies, because we set `eject: true`: that drops Panda's default presets,
  # and `@chakra-ui/panda-preset` declares no base of its own while reaching for
  # `utilities: { extend }` and `conditions: { extend }` (`plan.md` §3.2).
  "@pandacss/dev": 1.12.0
  "@pandacss/preset-base": 1.12.0
  "@chakra-ui/panda-preset": 3.36.1

  # TanStack Start and Router — the docs app's framework (`docs-site.md` §1.1). They are here
  # rather than in `apps/docs/package.json` for a reason no other entry in this file has: **two of
  # Plan B's three exit triggers are version facts about this exact pair** (`docs-site.md` §1.7,
  # B2 and B3). B2 fires when a release moves the `solid-js` peer off the 2.x range; B3 fires when
  # the line stalls for two consecutive Solid bumps. Under a floating range either one arrives as
  # an unreproducible local breakage on whichever day the registry moved, and the exit criteria
  # stop being observable.
  #
  # **The 2.0 prerelease is the line, and `latest` is not it.** On 2026-08-13 the dist-tags are
  # `rc: 2.0.0-rc.0` / `beta: 2.0.0-beta.31` / `latest: 1.168.42` for Start and
  # `rc: 2.0.0-rc.0` / `beta: 2.0.0-beta.30` / `latest: 1.170.25` for Router. The 1.x `latest`
  # line does not peer SolidJS 2.0 at all, so `^`-ranging these would silently pull the wrong
  # major.
  #
  # Both followed `solid-js@2.0.0-rc.0` on the same day it landed, which is B2 and B3 evaluated
  # and not fired: the catalog solves, and the line did not stall.
  "@tanstack/solid-start": 2.0.0-rc.0
  "@tanstack/solid-router": 2.0.0-rc.0

minimumReleaseAgeExclude:
  - '@solidjs/signals@2.0.0-rc.0'
  - '@solidjs/vite-plugin@3.0.0-next.28'
  - '@solidjs/web@2.0.0-rc.0'
  - '@tanstack/solid-router@2.0.0-rc.0'
  - '@tanstack/solid-start-client@2.0.0-rc.0'
  - '@tanstack/solid-start-server@2.0.0-rc.0'
  - '@tanstack/solid-start@2.0.0-rc.0'
  - babel-preset-solid@2.0.0-rc.0
  - solid-js@2.0.0-rc.0
  - vite-plugin-solid@3.0.0-next.27

# `@solidjs/vite-plugin` depends on `babel-preset-solid` by RANGE, and a range resolves to whatever
# is newest on the registry that day — which is how the compiler drifted a version behind the
# runtime without anyone changing a file. The catalog entries above only govern specifiers that
# say `catalog:`; these collapse the nested ranges onto them.
#
# The second line is the same fact one level out: the `vite-plugin-solid` shim asks for
# `@solidjs/vite-plugin` by `^` range, so without this Storybook's copy of the compiler can
# resolve to a different version than the one every other pipeline compiles with.
overrides:
  babel-preset-solid: "catalog:"
  "@solidjs/vite-plugin": "catalog:"
